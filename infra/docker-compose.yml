name: buyhksim-v2
services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: buyhksim_v2
      POSTGRES_USER: buyhksim
      POSTGRES_PASSWORD: buyhksim
    ports: ["5432:5432"]
    volumes: ["buyhksim_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyhksim -d buyhksim_v2"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["buyhksim_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  buyhksim_pg:
  buyhksim_redis:
