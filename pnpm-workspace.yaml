packages:
  - apps/*
  - packages/*

overrides:
  'sharp@<0.35.0': ^0.35.3
  'postcss@<=8.5.17': ^8.5.25
  'bl@>=4.0.0 <4.0.3': ^4.0.3
  'uuid@<11.1.1': ^11.1.1
  '@fast-csv/parse@<4.3.6': ^4.3.6
  'fast-csv@<4.3.6': ^4.3.6

allowBuilds:
  '@node-rs/argon2': true
  '@nestjs/core': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  sharp: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@swc/core'
  - esbuild
  - sharp
